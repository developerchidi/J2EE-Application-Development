<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sửa Khoa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto py-8">
    <h2 class="text-2xl font-bold mb-6 text-blue-700">Sửa Khoa</h2>
    <form th:action="@{'/faculties/edit/' + ${faculty.id}}" th:object="${faculty}" method="post" class="bg-white p-6 rounded shadow max-w-md mx-auto">
        <div class="mb-4">
            <label class="block mb-1 font-medium">Tên Khoa:</label>
            <input type="text" th:field="*{name}" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div class="flex gap-4">
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Cập nhật</button>
            <a th:href="@{/faculties}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Quay lại</a>
        </div>
    </form>
</div>
</body>
</html>
