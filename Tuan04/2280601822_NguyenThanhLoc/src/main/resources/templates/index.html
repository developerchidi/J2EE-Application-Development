<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tree View - Quản lý Sinh viên</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto py-8">
    <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">Tree View: Khoa → Môn học → Lớp → Sinh viên</h2>
    <ul class="space-y-4">
        <li th:each="faculty : ${faculties}" class="bg-white rounded-lg shadow p-4">
            <div class="font-semibold text-lg text-blue-600">Khoa: <span th:text="${faculty.name}"></span></div>
            <ul class="ml-6 mt-2 border-l-2 border-blue-200 pl-4">
                <li th:each="subject : ${faculty.subjects}" class="mb-2">
                    <div class="text-blue-500 font-medium">Môn học: <span th:text="${subject.name}"></span></div>
                    <ul class="ml-6 mt-1 border-l border-blue-100 pl-3">
                        <li th:each="cls : ${subject.classes}" class="mb-1">
                            <div class="text-blue-400">Lớp: <span th:text="${cls.name}"></span></div>
                            <ul class="ml-6 mt-1">
                                <li th:each="student : ${cls.students}" class="flex items-center gap-2 text-gray-700">
                                    <span class="inline-block w-4">👤</span>
                                    <span th:text="${student.lastName + ' ' + student.firstName}"></span>
                                </li>
                                <li th:if="${#lists.isEmpty(cls.students)}" class="italic text-gray-400">Chưa có sinh viên nào đăng ký.</li>
                            </ul>
                        </li>
                        <li th:if="${#lists.isEmpty(subject.classes)}" class="italic text-gray-400">Chưa có lớp nào.</li>
                    </ul>
                </li>
                <li th:if="${#lists.isEmpty(faculty.subjects)}" class="italic text-gray-400">Chưa có môn học nào.</li>
            </ul>
        </li>
        <li th:if="${#lists.isEmpty(faculties)}" class="italic text-gray-400">Chưa có khoa nào.</li>
    </ul>
    <div class="flex flex-wrap gap-4 justify-center mt-8">
        <a th:href="@{/faculties}" class="px-4 py-2 bg-blue-600 text-white rounded shadow hover:bg-blue-700">Quản lý Khoa</a>
        <a th:href="@{/subjects}" class="px-4 py-2 bg-blue-500 text-white rounded shadow hover:bg-blue-600">Quản lý Môn học</a>
        <a th:href="@{/classes}" class="px-4 py-2 bg-blue-400 text-white rounded shadow hover:bg-blue-500">Quản lý Lớp</a>
        <a th:href="@{/students}" class="px-4 py-2 bg-blue-300 text-white rounded shadow hover:bg-blue-400">Quản lý Sinh viên</a>
        <a th:href="@{/enrollments}" class="px-4 py-2 bg-green-500 text-white rounded shadow hover:bg-green-600">Quản lý Đăng ký học</a>
    </div>
</div>
</body>
</html>
