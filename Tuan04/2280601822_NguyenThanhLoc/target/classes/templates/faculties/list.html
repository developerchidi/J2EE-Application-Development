<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách Khoa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto py-8">
    <h2 class="text-2xl font-bold mb-6 text-blue-700">Danh sách Khoa</h2>
    <a th:href="@{/faculties/add}" class="mb-4 inline-block px-4 py-2 bg-blue-600 text-white rounded shadow hover:bg-blue-700">Thêm Khoa</a>
    <div class="overflow-x-auto">
        <table class="min-w-full bg-white rounded shadow">
            <thead class="bg-blue-100">
            <tr>
                <th class="py-2 px-4 text-left">Tên Khoa</th>
                <th class="py-2 px-4 text-left">Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="faculty : ${faculties}" class="border-b hover:bg-blue-50">
                <td class="py-2 px-4" th:text="${faculty.name}"></td>
                <td class="py-2 px-4">
                    <a th:href="@{'/faculties/edit/' + ${faculty.id}}" class="text-blue-600 hover:underline mr-2">Sửa</a>
                    <a th:href="@{'/faculties/delete/' + ${faculty.id}}" class="text-red-600 hover:underline" onclick="return confirm('Xác nhận xóa?')">Xóa</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <a th:href="@{/}" class="mt-6 inline-block text-blue-500 hover:underline">← Về trang chủ</a>
</div>
</body>
</html>
