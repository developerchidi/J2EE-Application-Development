<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sửa Môn học</title>
</head>
<body>
<h2>Sửa Môn học</h2>
<form th:action="@{'/subjects/edit/' + ${subject.id}}" th:object="${subject}" method="post">
    <label>Tên Môn học:</label>
    <input type="text" th:field="*{name}" required />
    <label>Khoa:</label>
    <select th:field="*{facultyId}" required>
        <option th:each="faculty : ${faculties}" th:value="${faculty.id}" th:text="${faculty.name}" th:selected="${faculty.id == subject.facultyId}"></option>
    </select>
    <button type="submit">Cập nhật</button>
    <a th:href="@{/subjects}">Quay lại</a>
</form>
</body>
</html>
